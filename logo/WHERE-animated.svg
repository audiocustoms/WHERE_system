  <style>
    .corner { animation: corner 4.8s both infinite; }
    .bar { animation: 4.8s both infinite; }
    .wordmark { animation: wordmark 4.8s both infinite; }
    .scanner { opacity: 0; animation: scan 4.8s linear both infinite; }

    @keyframes corner {
      0%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
      17%, 89% { opacity: 1; transform: translate(0, 0); }
    }

    .bar-0 { animation-name: bar-0; }
    @keyframes bar-0 {
      0%, 13% { opacity: 0; transform: translateY(14px); }
      24%, 89% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }

    .bar-1 { animation-name: bar-1; }
    @keyframes bar-1 {
      0%, 15% { opacity: 0; transform: translateY(14px); }
      26%, 89% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }

    .bar-2 { animation-name: bar-2; }
    @keyframes bar-2 {
      0%, 17% { opacity: 0; transform: translateY(14px); }
      28%, 89% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }

    .bar-3 { animation-name: bar-3; }
    @keyframes bar-3 {
      0%, 19% { opacity: 0; transform: translateY(14px); }
      30%, 89% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }

    .bar-4 { animation-name: bar-4; }
    @keyframes bar-4 {
      0%, 21% { opacity: 0; transform: translateY(14px); }
      32%, 89% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }

    @keyframes wordmark {
      0%, 50% { opacity: 0; transform: translateY(20px); }
      62%, 89% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }

    @keyframes scan {
      0%, 27% { opacity: 0; transform: translateY(305px); }
      32% { opacity: 1; }
      49% { opacity: 1; }
      55%, 100% { opacity: 0; transform: translateY(708px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .corner, .bar, .wordmark { animation: none; }
      .scanner { animation: none; }
    }
  </style>
