[package]
name = "where-module-go"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WHERE - does my stuff go? Orders, package slips and article pricing"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "rust_decimal",
] }
utoipa = { version = "6.0.0", features = ["decimal", "axum_extras"] }
where-api = { version = "0.1.0", path = "../where-api" }
where-domain = { version = "0.1.0", path = "../where-domain" }
where-modules = { version = "0.1.0", path = "../where-modules" }
where-persistence = { version = "0.1.0", path = "../where-persistence" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
