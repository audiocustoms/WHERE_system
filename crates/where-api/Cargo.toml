[package]
name = "where-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["decimal", "axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
where-domain = { version = "0.1.0", path = "../where-domain" }
where-modules = { version = "0.1.0", path = "../where-modules" }
where-persistence = { version = "0.1.0", path = "../where-persistence" }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
