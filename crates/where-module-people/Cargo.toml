[package]
name = "where-module-people"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WHERE - are my people? Employees and personnel"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "rust_decimal",
] }
utoipa = { version = "6.0.0", features = ["chrono", "axum_extras"] }
quick-xml = "0.38.4"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
where-api = { version = "0.1.0", path = "../where-api" }
where-domain = { version = "0.1.0", path = "../where-domain" }
where-modules = { version = "0.1.0", path = "../where-modules" }
where-persistence = { version = "0.1.0", path = "../where-persistence" }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
