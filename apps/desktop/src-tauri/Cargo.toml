[package]
name = "where-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri desktop shell for the WHERE rebuild"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
postgresql_embedded = { version = "0.22.0", default-features = false, features = [
    "bundled",
    "tokio",
] }
serde_json = "1.0.140"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-http = "2.7.0"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["v4"] }
where-server = { version = "0.1.0", path = "../../../crates/where-server" }
