name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # The workspace test would also build the desktop shell, whose build script
      # downloads PostgreSQL binaries; these three crates cover API and modules.
      - name: Tests
        run: cargo test -p where-api -p where-module-people -p where-server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type and template check
        working-directory: apps/web
        run: npm run check

      - name: Build SPA
        working-directory: apps/web
        run: npm run build
